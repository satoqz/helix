# Neovim's default palette: https://github.com/neovim/neovim/blob/master/src/nvim/highlight_group.c

inherits = "nvim-dark"

[palette]
fog   = "#14161b"
stone = "#4f5258"
night = "#e0e2ea"
panel = "#c4c6cd"
